name: Deploy to Digital Ocean

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}

      - name: Create deployment package
        run: |
          tar -czf deploy.tar.gz \
            .next \
            public \
            package.json \
            pnpm-lock.yaml \
            next.config.ts \
            ecosystem.config.cjs

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/tmp"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT || 22 }}
          script: |
            set -e
            
            APP_DIR="/var/www/yogi_blevins"
            BACKUP_DIR="/var/www/yogi_blevins_backup_$(date +%Y%m%d_%H%M%S)"
            
            echo "=== Starting deployment ==="
            
            # Create app directory if it doesn't exist
            sudo mkdir -p $APP_DIR
            sudo chown -R $USER:$USER $APP_DIR
            
            # Backup current deployment (if exists)
            if [ -d "$APP_DIR/.next" ]; then
              echo "Creating backup..."
              sudo cp -r $APP_DIR $BACKUP_DIR
            fi
            
            # Extract new deployment
            echo "Extracting deployment package..."
            cd $APP_DIR
            tar -xzf /tmp/deploy.tar.gz
            rm /tmp/deploy.tar.gz
            
            # Install production dependencies
            echo "Installing production dependencies..."
            pnpm install --prod --frozen-lockfile
            
            # Restart the application with PM2
            echo "Restarting application..."
            if pm2 describe yogi-blevins > /dev/null 2>&1; then
              pm2 reload yogi-blevins --update-env
            else
              pm2 start ecosystem.config.cjs
            fi
            
            # Save PM2 process list
            pm2 save
            
            # Clean up old backups (keep last 3)
            echo "Cleaning up old backups..."
            ls -dt /var/www/yogi_blevins_backup_* 2>/dev/null | tail -n +4 | xargs -r sudo rm -rf
            
            echo "=== Deployment completed successfully ==="

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT || 22 }}
          script: |
            echo "Waiting for application to start..."
            sleep 5
            
            # Check if the app is responding
            for i in {1..10}; do
              if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200\|301\|302"; then
                echo "✓ Application is healthy!"
                pm2 status
                exit 0
              fi
              echo "Waiting for application... (attempt $i/10)"
              sleep 3
            done
            
            echo "✗ Health check failed!"
            pm2 logs yogi-blevins --lines 50
            exit 1

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - name: Deployment failed notification
        run: |
          echo "::error::Deployment to Digital Ocean failed!"
          echo "Check the deploy job logs for details."

